services:
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: sp2-stage-backend
    ports:
      - "8003:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/sports_passport.db
    volumes:
      - ./data:/app/data
      - ./backend/.env:/app/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
