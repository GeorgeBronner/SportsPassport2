[project]
name = "sports-passport"
version = "0.1.0"
description = "SportsPassport2 multi-league game attendance tracker API"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "python-multipart>=0.0",
    "sqlalchemy>=2.0",
    "alembic>=1.12",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=5.0",
    "python-dotenv>=1.0",
    "httpx>=0.25",
    "aiohttp>=3.9",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "email-validator>=2.1",
    "sentry-sdk[fastapi]>=2.0",
    "apscheduler>=3.10",
    "prometheus-fastapi-instrumentator>=8.0.2",
    "mailtrap>=2.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "ruff>=0.16.1",
    "pyright>=1.1.411",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's whole dependency-injection design is function calls in argument
# defaults, so B008 is noise on every endpoint. Whitelisting the callables
# keeps the rule useful for genuine mutable-default bugs.
# See docs/SP3_open_issues.md #4.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.File",
    "fastapi.Form",
]

[tool.ruff.lint.per-file-ignores]
# Tests lean on long literal fixtures and pytest's assert-rewriting idioms.
"tests/**" = ["E501"]
# The models are a fully-connected cycle (Game <-> League/Team/Venue,
# UserGameAttendance <-> User), so every cross-model relationship import is
# TYPE_CHECKING-only — a real import would be circular. UP037 doesn't know
# that a quoted Mapped[...] here isn't just style: under 3.14's PEP 649 lazy
# annotation evaluation, unquoting one raises NameError the moment anything
# touches that class's __annotations__ (get_type_hints, some serializers),
# since the referenced name is never bound at runtime.
"sports_passport/models/*.py" = ["UP037"]

[tool.pyright]
include = ["sports_passport", "scripts", "tests"]
exclude = ["**/__pycache__", "alembic/versions"]
pythonVersion = "3.14"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
filterwarnings = [
    "error",
    # Third-party: starlette's TestClient deprecates httpx in favor of httpx2.
    # Not actionable from our code; only affects the test client.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
    # Third-party: slowapi 0.1.10 (latest as of the 3.14 bump) still calls
    # asyncio.iscoroutinefunction, deprecated in 3.14 for removal in 3.16.
    # Not actionable from our code; revisit when slowapi ships a fix.
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
]
