name: Deploy to Oracle (Production)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -e
            cd ~/docker-config/sportspassport2

            # Pull latest code
            git pull

            # Rebuild image and redeploy
            docker compose build --no-cache
            docker compose up -d

            # Verify
            docker logs sportspassport2-backend --tail 20
